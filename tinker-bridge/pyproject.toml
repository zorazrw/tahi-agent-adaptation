[project]
name = "agent-cowork-tinker-bridge"
version = "0.1.0"
description = "Python bridge for running Tinker inference from agent-cowork"
requires-python = ">=3.11"
dependencies = [
  "tinker_cookbook @ git+https://github.com/thinking-machines-lab/tinker-cookbook.git",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tinker_bridge"]

[tool.hatch.metadata]
allow-direct-references = true

