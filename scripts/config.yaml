# -- Mode --
mode: reinforce  # "dpo", "opd", or "reinforce"

# -- Model --
model_name: Qwen/Qwen3-4B-Instruct-2507
renderer_name: qwen3_instruct
lora_rank: 32

# -- Update --
update_every_n_sessions: 1

# -- Training (shared) --
dry_run: false
learning_rate: 1.0e-5
num_epochs: 1
batch_size: 1
lr_schedule: linear
max_steps: null

# -- DPO-specific --
dpo_beta: 0.1

# -- OPD-specific --
opd_max_tokens: 2048
opd_temperature: 1.0
opd_topk: 20
opd_max_context_length: 32768

# -- REINFORCE-specific --
reward_alpha: 0.05
initial_baseline: 0.0

# -- Logging --
wandb_project: null
wandb_name: null

# -- Proxy Server --
proxy_host: localhost
proxy_port: 8000
