# Standard last-k DPO config for session-by-session streaming experiments.
# This keeps only the fields needed by `server_lastk.py`.

# -- Mode --
mode: dpo

# -- Update --
update_every_n_sessions: 1
training_window_sessions: 4
training_window_min_sessions: 4
training_session_max_uses: 4

# -- Inference --
temperature: 0.3
logprobs: false

# -- Training (shared) --
lora_rank: 32
dry_run: false
learning_rate: 3.0e-5
num_epochs: 1
batch_size: 4
lr_schedule: constant
max_steps: null
max_length: null
save_every: 0

# -- DPO-specific --
dpo_beta: 0.5
dpo_pair_mode: first_last
dpo_rpo_alpha: 0.1
dpo_use_ipo: false
dpo_online_rollout: true
dpo_rollout_max_tokens: 16384
dpo_rollout_temperature: 0.7
dpo_rollout_attempts: 1
dpo_log_rollout_samples: true
dpo_rollout_sample_log_chars: 16384
dpo_artifact_only_rollout_instruction: false

# -- Logging --
wandb_project: null
wandb_name: null
log_root: logs/online_training
experiment_name: null  # null => auto-create a timestamped experiment directory per server run

# -- Model lifecycle --
preload_model: Qwen/Qwen3.6-35B-A3B

# -- Proxy Server --
proxy_host: localhost
proxy_port: 8000
state_path: null  # null => store state under <log_root>/<experiment_name>/state.json
block_during_training: true
