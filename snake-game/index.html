<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON SNAKE // ARCADE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crt-container">
        <div class="crt-overlay"></div>
        <div class="scanlines"></div>
        <div class="screen-curve"></div>
        
        <div class="game-wrapper">
            <header class="arcade-header">
                <h1 class="glitch" data-text="NEON SNAKE">NEON SNAKE</h1>
                <div class="subtitle">ARCADE EDITION v1.0</div>
            </header>
            
            <div class="game-panel">
                <div class="stats-bar">
                    <div class="stat">
                        <span class="stat-label">SCORE</span>
                        <span class="stat-value" id="score">0000</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">HIGH</span>
                        <span class="stat-value" id="highScore">0000</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">LEVEL</span>
                        <span class="stat-value" id="level">01</span>
                    </div>
                </div>
                
                <canvas id="gameCanvas" width="600" height="400"></canvas>
                
                <div class="controls-hint">
                    <div class="key-hint">
                        <span class="key">↑</span>
                        <span class="key">↓</span>
                        <span class="key">←</span>
                        <span class="key">→</span>
                    </div>
                    <span class="hint-text">USE ARROW KEYS</span>
                </div>
            </div>
            
            <div class="game-over-screen" id="gameOverScreen">
                <div class="game-over-content">
                    <h2 class="game-over-title">GAME OVER</h2>
                    <div class="final-score">
                        <span class="final-label">FINAL SCORE</span>
                        <span class="final-value" id="finalScore">0</span>
                    </div>
                    <button class="restart-btn" id="restartBtn">
                        <span class="btn-text">INSERT COIN</span>
                        <span class="btn-sub">[PRESS SPACE]</span>
                    </button>
                </div>
            </div>
            
            <div class="start-screen" id="startScreen">
                <div class="start-content">
                    <h2 class="start-title">READY?</h2>
                    <button class="start-btn" id="startBtn">
                        <span class="btn-text">START GAME</span>
                        <span class="btn-sub">[PRESS SPACE]</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
